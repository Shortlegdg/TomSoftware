# Folder holding the read-only menu files.
toms.menu.dir=src/main/java/edu/epicode/tomSoftware/data/menu/

# Folder holding the table files created at runtime.
toms.tables.dir=src/main/java/edu/epicode/tomSoftware/data/tables/

# Rotating log files.
toms.log.file=logs/toms.log
toms.log.max.bytes=1048576
toms.log.file.count=5

# Accepted ranges for the values typed by the waiter.
toms.table.id.min=1
toms.table.id.max=999
toms.table.people.min=1
toms.table.people.max=50
